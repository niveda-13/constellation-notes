
<!DOCTYPE html>
<html lang="en">


<!-- HEAD -->
<head>
    <!-- Contains information about the webpage -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the website adapt to different screen sizes -->

    <title>constellation-notes</title>
    <!-- displayed title -->


    <!-- Connects this HTML file to CSS stylesheet.
         Flask looks for style.css inside the static folder. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<!-- BODY -->
<body>
    <!--the visible webpage -->

    <!-- MAIN CONTAINER
         class allows styling of the entire container using CSS. -->

    <main class="container">


        <!-- HEADER -->
        <header class="page-header">

            <h1>constellation-notes</h1>
            <p class="subtitle">
                create your own constellation 
            </p>

        </header>

        <!-- SECTION 1 -->
        <!-- CONSTELLATION EDITOR
             This section is for the interactive night sky. -->

        <section class="sky-section">


            <!-- THE SKY
                 class="sky" allows CSS to style it.
                 id="sky" allows JavaScript to find it.

                 Later, JavaScript will use this element to:
                 1. Detect user clicks and place stars
                 2. Draw lines between selected stars.
                 3. Remove stars when requested. -->

            <div class="sky" id="sky">

                <svg id="connections"></svg> <!--to let lines be drawn between stars-->
                <!--svg - creates a vector drawing layer-->


                <!-- PLACEHOLDER INSTRUCTION
                     Displayed while the sky is empty.

                     JavaScript will eventually remove this message
                     when the user starts placing stars. -->

                <p class="sky-instruction">
                    start clicking to create the stars..
                </p>
            </div>

            <!-- renders a clickable "delete star" button that later js will access-->
            <button id="delete-star">Delete selected star</button> 

        <!-- SECTION 2-->
        </section>

        <!-- constellation details -->
        <section class="details-section">

        <label for="constellation-name">Name your constellation!</label>
        <input
            type="text"
            id="constellation-name"
            placeholder="e.g.'my sirius'"
        >

        <label for="personal-message">Write a message</label>
        <textarea
            id="personal-message"
            placeholder="A little note..."
            rows="5"
        ></textarea>

    </section> 

        <!-- FOOTER-->

        <footer>
            <p>Thank you for using this!</p>
        </footer>


    </main>

    <!-- for loading the java_script -->
    <!-- Connects this HTML page to script.js inside the "static" folder -->
    <!-- Flask uses url_for() to automatically find the right file path -->
    <script src="{{ url_for('static', filename='java_script.js') }}"></script>
    

</body>

</html>
