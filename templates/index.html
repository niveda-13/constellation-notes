
<!DOCTYPE html>
<!-- Tells the browser that this is an HTML5 document -->

<html lang="en">

<head>
    <!-- Contains information about the webpage, not the visible content -->

    <meta charset="UTF-8">
    <!-- Allows the page to display special characters and symbols -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the website adapt to different screen sizes -->

    <title>constellation-notes</title>
    <!-- The title displayed in the browser tab -->


    <!-- Connects this HTML file to our CSS stylesheet.
         Flask looks for style.css inside the static folder. -->

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>
    <!-- Everything inside the body is part of the visible webpage -->


    <!-- MAIN CONTAINER
         Groups the main content of our website together.
         The class allows us to style the entire container using CSS. -->

    <main class="container">


        <!-- HEADER
             Contains the introductory text and main heading. -->

        <header class="page-header">

            <!-- Main heading of the website -->

            <h1>constellation-notes</h1>

            <!-- Short description underneath the heading -->

            <p class="subtitle">
                create your own constellation 
            </p>

        </header>


        <!-- CONSTELLATION EDITOR
             This section will eventually contain our interactive night sky. -->

        <section class="sky-section">


            <!-- THE SKY
                 This div is our main interactive canvas.

                 class="sky" allows CSS to style it.
                 id="sky" allows JavaScript to find it.

                 Later, JavaScript will use this element to:
                 1. Detect where the user clicks.
                 2. Place stars at those coordinates.
                 3. Draw lines between selected stars.
                 4. Remove stars when requested. -->

            <div class="sky" id="sky">


                <!-- PLACEHOLDER INSTRUCTION
                     Displayed while the sky is empty.

                     JavaScript will eventually remove this message
                     when the user starts placing stars. -->

                <p class="sky-instruction">
                    start clicking to create the stars..
                </p>


            </div>

        </section>


        <!-- FOOTER
             A small decorative message at the bottom of the page. -->

        <footer>

            <p>Thank you for using this!</p>

        </footer>


    </main>

</body>

</html>
